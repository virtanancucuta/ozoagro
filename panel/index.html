<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2716%27 fill=%27%2315803D%27/%3E%3Ctext x=%2716%27 y=%2722%27 font-size=%2718%27 text-anchor=%27middle%27 fill=%27white%27 font-family=%27Arial%27%3EO%3C/text%3E%3C/svg%3E">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel OZOAGRO Colombia</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#15803D',
            secondary: '#22C55E',
            gold: '#A16207',
            danger: '#DC2626',
            surface: '#F0FDF4'
          }
        }
      }
    }
  </script>
  <style>
    [x-cloak] { display: none !important; }
    .sidebar-link.active { background-color: rgba(21, 128, 61, 0.1); color: #15803D; border-left: 3px solid #15803D; }
    .tab-btn.active { border-bottom: 2px solid #15803D; color: #15803D; }
    .loading { opacity: 0.5; pointer-events: none; }
    #bottom-nav { display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: #fff; border-top: 1px solid #E5E7EB; box-shadow: 0 -2px 8px rgba(0,0,0,.06); padding-bottom: env(safe-area-inset-bottom); }
    #bottom-nav a, #bottom-nav button { flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 56px; font-size: 11px; color: #4B5563; text-decoration: none; background: none; border: 0; }
    #bottom-nav .active, #bottom-nav a.active { color: #15803D; }
    #bottom-nav svg { width: 22px; height: 22px; }
    /* ============ MOVIL (<=768px) — aditivo, no toca desktop ============ */
    @media (max-width: 768px) {
      html, body { overflow-x: hidden; max-width: 100vw; }
      main { max-width: 100vw; overflow-x: hidden; padding-bottom: 5.5rem !important; }
      #module-container { min-width: 0; overflow-wrap: break-word; }
      #module-container .flex > * { min-width: 0; }
      #module-container .space-y-6 > * + * { margin-top: 1rem; }
      #module-container .p-6 { padding: 1rem; }
      #module-container h1.text-2xl { font-size: 1.25rem; line-height: 1.75rem; }

      /* Cabecera del modulo: titulo + acciones apiladas, botones a lo ancho */
      #module-container > div > .flex.justify-between:first-child { flex-direction: column; align-items: stretch; gap: .6rem; }
      #module-container > div > .flex.justify-between:first-child > .flex { width: 100%; flex-wrap: wrap; gap: .5rem; }
      #module-container > div > .flex.justify-between:first-child > .flex > .flex { width: 100%; }
      #module-container > div > .flex.justify-between:first-child button { flex: 1 1 auto; justify-content: center; min-height: 40px; }
      #module-container > div > .flex.justify-between:first-child select,
      #module-container > div > .flex.justify-between:first-child input { width: 100%; min-height: 40px; flex: 1 1 100%; }
      #module-container .flex.hidden { display: none; }

      /* Filtros sueltos (selects/inputs) y area tactil 40px */
      #module-container select, #module-container input[type="date"] { min-height: 40px; max-width: 100%; }
      #module-container button, #module-container .tab-btn, #module-container .subfiltro-btn { min-height: 40px; }
      #module-container .flex { flex-wrap: wrap; }
      #module-container input.w-72 { width: 100%; }

      /* Pestanas: una fila con scroll horizontal */
      #module-container .flex:has(> .tab-btn) { flex-wrap: nowrap; overflow-x: auto; white-space: nowrap; -webkit-overflow-scrolling: touch; gap: .25rem; scrollbar-width: none; }
      #module-container .flex:has(> .tab-btn)::-webkit-scrollbar { display: none; }
      #module-container .tab-btn { flex: 0 0 auto; padding-left: .75rem; padding-right: .75rem; font-size: .9rem; }

      /* Grids: 1 columna por defecto; KPIs (tarjetas) en 2 columnas */
      #module-container .grid[class*="grid-cols-"] { grid-template-columns: minmax(0, 1fr) !important; }
      #module-container .grid:has(> .rounded-xl.p-4), #module-container .grid:has(> .rounded-xl.p-6),
      #module-container .grid:has(> .rounded-lg.p-4), #module-container .grid:has(> .rounded-lg.p-3),
      #module-container #cobertura-inventario { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; gap: .6rem; }
      #module-container #productos-cards, #module-container .grid.grid-cols-1:not(.x1):not(.x2) { grid-template-columns: minmax(0, 1fr) !important; }
      #module-container .grid .text-3xl, #module-container .grid .text-2xl { font-size: 1.25rem; line-height: 1.7rem; }
      #module-container .grid > .rounded-xl .text-3xl, #module-container .grid > .rounded-xl .text-2xl { font-size: 1.2rem; line-height: 1.6rem; word-break: break-word; }
      #module-container .grid > .rounded-xl.p-6 { padding: .85rem; }

      /* Tablas: contenedor con scroll horizontal, celdas compactas, 1a columna fija */
      .tbl-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; max-width: 100%; }
      .tbl-wrap table { min-width: 640px; font-size: 13px; }
      .tbl-wrap th, .tbl-wrap td { padding: .5rem .6rem !important; white-space: nowrap; }
      .tbl-wrap th:first-child, .tbl-wrap td:first-child { position: sticky; left: 0; z-index: 1; background: #fff; box-shadow: 2px 0 0 #E5E7EB; }
      .tbl-wrap thead th:first-child { background: #F9FAFB; }
      .tbl-wrap tbody tr:hover td:first-child { background: #F9FAFB; }
      #module-container .tbl-wrap .flex { flex-wrap: nowrap; }
      .tbl-wrap td button, .tbl-wrap td a.p-1 { min-height: 36px; min-width: 36px; display: inline-flex; align-items: center; justify-content: center; }
      #module-container .overflow-x-auto { max-width: 100%; }

      /* Modales a pantalla completa con scroll interno y acciones fijas abajo */
      div[id^="modal-"] { padding: 0 !important; align-items: stretch !important; }
      div[id^="modal-"] > div { width: 100vw !important; max-width: 100vw !important; height: 100dvh; max-height: 100dvh !important; border-radius: 0 !important; overflow-y: auto !important; display: flex; flex-direction: column; padding: 1rem !important; }
      div[id^="modal-"] > div > form { flex: 1; display: flex; flex-direction: column; }
      div[id^="modal-"] > div > form > * + * { margin-top: .75rem; }
      div[id^="modal-"] > div > form > .flex.justify-end:last-child,
      div[id^="modal-"] #chat-footer { position: sticky; bottom: -1rem; margin-top: auto; background: #fff; padding: .75rem 0; border-top: 1px solid #E5E7EB; z-index: 2; }
      div[id^="modal-"] > div > form > .flex.justify-end:last-child { margin-bottom: -1rem; }
      div[id^="modal-"] > div > form > .flex.justify-end:last-child > button { flex: 1 1 0; min-height: 44px; }
      div[id^="modal-"] .grid { grid-template-columns: minmax(0, 1fr) !important; }
      div[id^="modal-"] input, div[id^="modal-"] select, div[id^="modal-"] textarea { min-height: 40px; max-width: 100%; }
      div[id^="modal-"] .flex { flex-wrap: wrap; }

      /* Login */
      #login-screen { padding: 1rem; }
      #login-screen > div { padding: 1.5rem; }
      #login-screen input, #login-screen button { min-height: 44px; }

      /* Bottom nav visible; sidebar deja espacio */
      #bottom-nav { display: flex; }
      #sidebar { padding-bottom: 4.5rem; }
    }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">
  <!-- Login Screen -->
  <div id="login-screen" class="min-h-screen flex items-center justify-center bg-surface">
    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
      <div class="text-center mb-6">
        <h1 class="text-3xl font-bold"><span class="text-gold">OZO</span><span class="text-primary">AGRO</span></h1>
        <p class="text-gray-600 mt-2">Panel de Administracion</p>
      </div>
      <form id="login-form" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
          <input type="email" id="login-email" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-primary focus:border-primary" placeholder="ceo@ozoagro.co">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Contrasena</label>
          <input type="password" id="login-password" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-primary focus:border-primary">
        </div>
        <div id="login-error" class="text-red-600 text-sm hidden"></div>
        <button type="submit" class="w-full bg-primary text-white py-2 rounded-lg hover:bg-green-700 transition font-medium">
          Iniciar Sesion
        </button>
      </form>
    </div>
  </div>

  <!-- Main App -->
  <div id="app-screen" class="hidden">
    <!-- Boton hamburguesa (solo movil) -->
    <button id="sidebar-toggle" type="button" aria-label="Abrir menu" class="md:hidden fixed top-3 left-3 z-50 bg-white border shadow rounded-lg p-2 text-primary">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <!-- Overlay oscuro (solo movil, cierra el sidebar) -->
    <div id="sidebar-overlay" class="md:hidden fixed inset-0 bg-black/50 z-40 hidden"></div>
    <!-- Sidebar -->
    <aside id="sidebar" class="fixed left-0 top-0 h-full w-64 bg-white border-r shadow-sm z-40 transform -translate-x-full md:translate-x-0 transition-transform duration-200">
      <div class="p-4 border-b">
        <h1 class="text-xl font-bold"><span class="text-gold">OZO</span><span class="text-primary">AGRO</span></h1>
        <p class="text-xs text-gray-500 mt-1">Panel CEO - Andres Gomez</p>
      </div>
      <nav class="p-4 space-y-1">
        <a href="#" data-module="pedidos" class="sidebar-link active flex items-center gap-3 px-3 py-2 rounded-lg text-gray-700 hover:bg-gray-100 transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
          Pedidos
        </a>
        <a href="#" data-module="ventas" class="sidebar-link flex items-center gap-3 px-3 py-2 rounded-lg text-gray-700 hover:bg-gray-100 transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
          Ventas
        </a>
        <a href="#" data-module="inventario" class="sidebar-link flex items-center gap-3 px-3 py-2 rounded-lg text-gray-700 hover:bg-gray-100 transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
          Inventario
        </a>
        <a href="#" data-module="gastos" class="sidebar-link flex items-center gap-3 px-3 py-2 rounded-lg text-gray-700 hover:bg-gray-100 transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
          Gastos
        </a>
        <a href="#" data-module="crm" class="sidebar-link flex items-center gap-3 px-3 py-2 rounded-lg text-gray-700 hover:bg-gray-100 transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
          CRM
        </a>
        <a href="#" data-module="chats" class="sidebar-link flex items-center gap-3 px-3 py-2 rounded-lg text-gray-700 hover:bg-gray-100 transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/></svg>
          Chats IA
        </a>
        <a href="#" data-module="balance" class="sidebar-link flex items-center gap-3 px-3 py-2 rounded-lg text-gray-700 hover:bg-gray-100 transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          Balance
        </a>
        <a href="#" data-module="config" class="sidebar-link flex items-center gap-3 px-3 py-2 rounded-lg text-gray-700 hover:bg-gray-100 transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
          Configuracion
        </a>
      </nav>
      <div class="absolute bottom-0 left-0 right-0 p-4 border-t">
        <button id="logout-btn" class="w-full text-sm text-gray-600 hover:text-red-600 transition">Cerrar Sesion</button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="md:ml-64 p-3 pt-16 md:p-6">
      <!-- Module Container -->
      <div id="module-container"></div>
    </main>
    <!-- Bottom nav (solo movil; se llena desde el sidebar) -->
    <nav id="bottom-nav" aria-label="Navegacion movil"></nav>
  </div>

  <!-- Scripts -->
  <script>
    // Sidebar movil: hamburguesa abre/cierra; overlay y .sidebar-link cierran. Bottom nav + tablas con scroll.
    (function () {
      var sb = document.getElementById('sidebar');
      var ov = document.getElementById('sidebar-overlay');
      var tg = document.getElementById('sidebar-toggle');
      var bn = document.getElementById('bottom-nav');
      function openSb() { sb.classList.remove('-translate-x-full'); ov.classList.remove('hidden'); }
      function closeSb() { sb.classList.add('-translate-x-full'); ov.classList.add('hidden'); }
      tg.addEventListener('click', function () { sb.classList.contains('-translate-x-full') ? openSb() : closeSb(); });
      ov.addEventListener('click', closeSb);
      var links = document.querySelectorAll('.sidebar-link');
      links.forEach(function (l) { l.addEventListener('click', function () { closeSb(); setTimeout(syncBottom, 0); }); });

      // Bottom nav: 4 modulos principales + "Mas" (abre el menu lateral)
      var main = ['pedidos', 'ventas', 'inventario', 'crm'];
      main.forEach(function (m) {
        var src = document.querySelector('.sidebar-link[data-module="' + m + '"]');
        if (!src) return;
        var a = document.createElement('a');
        a.href = '#'; a.dataset.module = m;
        a.innerHTML = src.querySelector('svg').outerHTML + '<span>' + src.textContent.trim() + '</span>';
        a.addEventListener('click', function (e) { e.preventDefault(); src.click(); });
        bn.appendChild(a);
      });
      var more = document.createElement('button');
      more.type = 'button';
      more.innerHTML = '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg><span>Mas</span>';
      more.addEventListener('click', function () { openSb(); });
      bn.appendChild(more);
      function syncBottom() {
        var act = document.querySelector('.sidebar-link.active');
        var m = act ? act.dataset.module : '';
        bn.querySelectorAll('a').forEach(function (a) { a.classList.toggle('active', a.dataset.module === m); });
      }
      syncBottom();

      // Tablas: envolver en .tbl-wrap (scroll horizontal en movil). Observa re-renders de los modulos.
      var mc = document.getElementById('module-container');
      function wrapTables() {
        mc.querySelectorAll('table').forEach(function (t) {
          if (t.parentElement && t.parentElement.classList.contains('tbl-wrap')) return;
          var w = document.createElement('div'); w.className = 'tbl-wrap';
          t.parentNode.insertBefore(w, t); w.appendChild(t);
        });
      }
      new MutationObserver(wrapTables).observe(mc, { childList: true, subtree: true });
    })();
  </script>
  <script src="js/config.js?v=20260906a"></script>
  <script src="js/app.js?v=20260906a"></script>
  <script src="js/modules/pedidos.js?v=20260906a"></script>
  <script src="js/modules/ventas.js?v=20260906a"></script>
  <script src="js/modules/inventario.js?v=20260906a"></script>
  <script src="js/modules/gastos.js?v=20260906a"></script>
  <script src="js/modules/crm.js?v=20260906a"></script>
  <script src="js/modules/chats.js?v=20260906a"></script>
  <script src="js/modules/balance.js?v=20260906a"></script>
  <script src="js/modules/config.js?v=20260906a"></script>
</body>
</html>
