server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Landing page (raiz) — el HTML nunca se cachea (siempre revalida): así cada Rebuild llega al navegador
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Panel admin — idem
    location /panel {
        alias /usr/share/nginx/html/panel;
        try_files $uri $uri/ /panel/index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # JS/CSS: cache corta (los scripts del panel ademas llevan ?v= en index.html)
    location ~* \.(js|css)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }

    # Imagenes, videos y fuentes: cache larga
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|woff2|mp4)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}
