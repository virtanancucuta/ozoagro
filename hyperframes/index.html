<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OZOAGRO - Video Promocional</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@700&family=Raleway:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    [data-composition-id="ozoagro-promo"] {
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #F0FDF4 0%, #DCFCE7 100%);
      overflow: hidden;
      position: relative;
      font-family: 'Raleway', sans-serif;
    }

    .scene {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      padding: 80px;
    }

    /* Scene 1: Intro */
    .scene-intro .icon-box {
      width: 180px; height: 180px;
      background: #15803D;
      border-radius: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 40px;
    }
    .scene-intro .icon-text {
      font-family: 'Raleway', sans-serif;
      font-size: 80px;
      font-weight: 700;
      color: white;
    }
    .scene-intro .icon-text sub { font-size: 50px; }
    .scene-intro .brand {
      font-family: 'Lora', serif;
      font-size: 100px;
      font-weight: 700;
      margin-bottom: 20px;
    }
    .scene-intro .ozo { color: #A16207; }
    .scene-intro .agro { color: #15803D; }
    .scene-intro .tag {
      font-size: 24px;
      color: #14532D;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    /* Scene 2: Benefits */
    .scene-benefits { background: #15803D; }
    .scene-benefits h2 {
      font-family: 'Lora', serif;
      font-size: 64px;
      color: white;
      margin-bottom: 50px;
    }
    .benefit-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 30px;
    }
    .benefit-item {
      background: white;
      padding: 30px;
      border-radius: 20px;
      text-align: center;
    }
    .benefit-icon { font-size: 50px; margin-bottom: 10px; }
    .benefit-text { font-size: 24px; font-weight: 600; color: #14532D; }

    /* Scene 3: CTA */
    .scene-cta { background: linear-gradient(135deg, #A16207 0%, #CA8A04 100%); }
    .scene-cta h2 {
      font-family: 'Lora', serif;
      font-size: 60px;
      color: white;
      margin-bottom: 40px;
    }
    .price-box {
      background: white;
      padding: 40px 80px;
      border-radius: 30px;
      text-align: center;
      margin-bottom: 30px;
    }
    .price { font-size: 70px; font-weight: 700; color: #15803D; }
    .price-label { font-size: 24px; color: #14532D; }
    .cta-text { font-size: 32px; color: white; font-weight: 600; }
  </style>
</head>
<body>
  <div data-composition-id="ozoagro-promo" data-start="0" data-duration="10" data-width="1080" data-height="1080" data-track-index="0">

    <!-- Scene 1: Intro (0-3.5s) -->
    <div class="scene scene-intro" id="scene-intro">
      <div class="icon-box">
        <span class="icon-text">O<sub>3</sub></span>
      </div>
      <div class="brand">
        <span class="ozo">OZO</span><span class="agro">AGRO</span>
      </div>
      <div class="tag">Tecnologia Ambiental</div>
    </div>

    <!-- Scene 2: Benefits (3.5-7s) -->
    <div class="scene scene-benefits" id="scene-benefits">
      <h2>Proteccion Natural</h2>
      <div class="benefit-grid">
        <div class="benefit-item">
          <div class="benefit-icon">🌿</div>
          <div class="benefit-text">100% Ecologico</div>
        </div>
        <div class="benefit-item">
          <div class="benefit-icon">✅</div>
          <div class="benefit-text">Sin Residuos</div>
        </div>
        <div class="benefit-item">
          <div class="benefit-icon">🐝</div>
          <div class="benefit-text">Seguro Abejas</div>
        </div>
        <div class="benefit-item">
          <div class="benefit-icon">🌍</div>
          <div class="benefit-text">Amigable</div>
        </div>
      </div>
    </div>

    <!-- Scene 3: CTA (7-10s) -->
    <div class="scene scene-cta" id="scene-cta">
      <h2>Protege tu Cosecha</h2>
      <div class="price-box">
        <div class="price">$130.000</div>
        <div class="price-label">1 Litro</div>
      </div>
      <div class="cta-text">Envio a toda Colombia</div>
    </div>

  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // Scene 1: Intro (0-3.5s)
    tl.to('#scene-intro', { opacity: 1, duration: 0.3 }, 0);
    tl.from('.icon-box', { scale: 0, duration: 0.6, ease: 'back.out(1.5)' }, 0.2);
    tl.from('.brand', { y: 40, opacity: 0, duration: 0.5 }, 0.6);
    tl.from('.tag', { y: 20, opacity: 0, duration: 0.4 }, 1);
    tl.to('#scene-intro', { opacity: 0, duration: 0.3 }, 3.2);

    // Scene 2: Benefits (3.5-7s)
    tl.to('#scene-benefits', { opacity: 1, duration: 0.3 }, 3.5);
    tl.from('.scene-benefits h2', { y: -30, opacity: 0, duration: 0.4 }, 3.7);
    tl.from('.benefit-item', { scale: 0, duration: 0.3, stagger: 0.15, ease: 'back.out(1.2)' }, 4);
    tl.to('#scene-benefits', { opacity: 0, duration: 0.3 }, 6.7);

    // Scene 3: CTA (7-10s)
    tl.to('#scene-cta', { opacity: 1, duration: 0.3 }, 7);
    tl.from('.scene-cta h2', { y: -30, opacity: 0, duration: 0.4 }, 7.2);
    tl.from('.price-box', { scale: 0.5, opacity: 0, duration: 0.5, ease: 'back.out(1.2)' }, 7.5);
    tl.from('.cta-text', { y: 20, opacity: 0, duration: 0.3 }, 8);

    window.__timelines['ozoagro-promo'] = tl;
  </script>
</body>
</html>
